services:
  db:
    image: mysql:8.0
    container_name: osticket-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-osticket}
      MYSQL_USER: ${MYSQL_USER:-osticket}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-osticket}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./docker/php
    container_name: osticket-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    volumes:
      - ./upload:/var/www/html
    environment:
      OSTICKET_DB_HOST: db
      OSTICKET_DB_NAME: ${MYSQL_DATABASE:-osticket}
      OSTICKET_DB_USER: ${MYSQL_USER:-osticket}
      OSTICKET_DB_PASSWORD: ${MYSQL_PASSWORD:-osticket}

  worker:
    build:
      context: ./analytics
      dockerfile: ../docker/worker/Dockerfile
    container_name: osticket-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      OSTICKET_DB_HOST: db
      OSTICKET_DB_PORT: 3306
      OSTICKET_DB_NAME: ${MYSQL_DATABASE:-osticket}
      OSTICKET_DB_USER: ${MYSQL_USER:-osticket}
      OSTICKET_DB_PASSWORD: ${MYSQL_PASSWORD:-osticket}
      OSTICKET_TABLE_PREFIX: ${OSTICKET_TABLE_PREFIX:-ost_}
      ANALYTICS_INTERVAL_SEC: ${ANALYTICS_INTERVAL_SEC:-900}
      ANALYTICS_SLA_FRT_MIN: ${ANALYTICS_SLA_FRT_MIN:-60}
      ANALYTICS_SLA_MTTR_HOURS: ${ANALYTICS_SLA_MTTR_HOURS:-24}
      ANALYTICS_ANOMALY_Z: ${ANALYTICS_ANOMALY_Z:-2.0}
    volumes:
      - ./analytics:/app

volumes:
  db_data:
